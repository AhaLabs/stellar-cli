[package]
name = "stellar-cli"
description = "Stellar CLI"
homepage = "https://github.com/theahaco/stellar-cli"
repository = "https://github.com/theahaco/stellar-cli"
authors = ["Stellar Development Foundation <info@stellar.org>"]
license = "Apache-2.0"
readme = "README.md"
version.workspace = true
edition = "2021"
rust-version.workspace = true
autobins = false
default-run = "stellar"

[[bin]]
name = "stellar"
path = "src/bin/stellar.rs"

[package.metadata.binstall]
pkg-url = "https://github.com/theahaco/stellar-cli/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[features]
default = ["additional-libs"]
additional-libs = ["soroban-cli/additional-libs"]
emulator-tests = ["soroban-cli/emulator-tests"]

[dependencies]
soroban-cli = { workspace = true }
