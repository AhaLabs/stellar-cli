name: Publish

# Disabled on the theahaco fork: the `stellar-cli`/`soroban-cli` crate names are
# owned by stellar on crates.io, so a publish would fail. Releases here ship
# prebuilt binaries via binaries.yml (cargo-binstall), not crates.io. Left as a
# manual trigger rather than deleted so it can be re-enabled if ever needed.
on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  publish:
    uses: stellar/actions/.github/workflows/rust-publish.yml@main
    with:
      additional-deb-packages: libudev-dev libdbus-1-dev
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
